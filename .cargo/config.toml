# Сборка под нативный CPU: включает AVX2/AVX-512/FMA/BMI для ВСЕГО кода
# (по умолчанию rustc целится в baseline x86-64 = только SSE2, и горячие циклы
# не векторизуются). Это даёт автовекторизацию аккумуляции/квантования/несущей.
#
# ВНИМАНИЕ: бинарь становится непереносимым на CPU без этих наборов инструкций.
# Для переносимого бинаря с тем же набором AVX-512+FMA замените на target-cpu=x86-64-v4.
# FMA-контракция меняет FP-результат на <=1 ULP (одно округление вместо двух) —
# верифицировано acquisition'ом, на сигнал не влияет.
[build]
rustflags = ["-C", "target-cpu=native"]
